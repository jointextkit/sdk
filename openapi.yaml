        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - to
              properties:
                to:
                  type: string
                  description: "E.164: your own verified phone or a verified recipient"
                  example: +14155550123
                from:
                  type: string
                  description: "Optional. Send this test from another of your numbers in the same mode (the automation is not changed), e.g. a verified toll-free while its own number is in review."
                properties:
                  type: object
                  additionalProperties: true
                  description: "Sample event properties for merge fields"
                  example:
                    plan: pro
                steps:
                  type: array
                  items:
                    type: string
                  description: "Only these send_sms step ids. Default: all of them"
      responses:
        200:
          description: "What was sent"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - automation_test
                  automation_id:
                    type: string
                  to:
                    type: string
                  from:
                    type: string
                  test:
                    type: boolean
                  properties:
                    type: object
                    additionalProperties: true
                  sent:
                    type: integer
