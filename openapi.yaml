openapi: 3.0.3
info:
  title: TextKit
  description: "Programmable SMS and phone numbers for developers. Send and receive texts, verify phone numbers, and provision numbers with one REST API. Test keys (tk_sk_test_...) work instantly against the sandbox; live keys are enabled after a short live-access review."
  version: 1.0.0
  contact:
    url: "https://jointextkit.com"
servers:
  - url: "https://api.jointextkit.com/v1"
security:
  - apiKey: []
paths:
  "/messages":
    post:
      operationId: sendMessage
      summary: "Send an SMS"
      description: "Sends an SMS from one of your numbers. In test mode the message is simulated: it reaches `delivered` but no text is sent (`simulated: true`, an X-TextKit-Simulated header, and a `notice` when `to` is a real-looking number). The one exception is a send to your own verified phone, which is really delivered when a verification sender is available (`simulated: false`). `from` may be omitted when the account has exactly one number for the key's mode (the sandbox number with a test key, the one live sending number with a live key); with none or several the request is refused and the error lists the choices under `numbers`. Supports the Idempotency-Key header, including with scheduled_at. A live send from a US local number that is not yet linked to an approved registration (sender.state other than active) is delivered only to your verified numbers; to anyone else it answers 403 sender_not_registered with an X-TextKit-Sender-State header (test_only | pending | action_needed). The same holds for a toll-free number until its toll_free.status is verified. An account without live access that owns a live toll-free number may use a live key here: until the account is live, a live send goes only from that toll-free number to your verified numbers (billed like any live send); any other live send answers 403 sender_not_registered."
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: "Makes retries safe for 24 hours: the same key and body replays the original successful response (with Idempotent-Replayed: true); a different body returns 409. Failed requests release the key."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - to
                - body
              properties:
                to:
                  type: string
                  example: +15005550006
                  description: "Recipient's number in E.164"
                from:
                  type: string
                  example: +15005550100
                  description: "One of your numbers, or a sender pool id (pool_...): TextKit picks a pool member, the same one for each recipient every time. Optional when the account has exactly one number for the key's mode."
                body:
                  type: string
                  maxLength: 1600
                  description: "The message text"
                customer_id:
                  type: string
                  description: "Optional. Attribute to one of your customers. Defaults to the customer the from-number is assigned to; a number assigned to another customer is rejected (400)."
                scheduled_at:
                  type: string
                  description: "Optional. Future ISO timestamp (or epoch ms), up to 30 days out. The message is queued and the response is a scheduled_message object instead of a message. A marketing message scheduled into the recipient's quiet hours is refused now (403 quiet_hours) or, with quiet_hours defer, moved to their next 8:00am; any other message is moved."
                category:
                  type: string
                  enum:
                    - marketing
                    - transactional
                    - otp
                  description: "Optional. It can make a message stricter (`marketing`), never looser: what a message is comes from the sending number's registration and its wording ([which messages are marketing](/docs/compliance-checks#which-messages-are-marketing)). A message outside its registration's use case is refused with 403 campaign_mismatch."
                quiet_hours:
                  type: string
                  enum:
                    - block
                    - defer
                  description: "Optional. What to do with a message in the recipient's quiet hours: `block` refuses it (403 quiet_hours), `defer` holds it until their next 8:00am. Omitted: the account default (a single marketing send is refused; every other message is held). One-time codes are never held."
                shorten_links:
                  type: boolean
                  description: "Optional. Rewrite every http(s) link in `body` to a short link with clicks tracked (`links` on the message, `message.link_clicked` events): on <your business>.txtkto.com once your business is verified, txtkto.com before that, or your own link domain when you have an active one (POST /link-domains). The links are checked as you wrote them; segments are counted on the shortened text. Works with scheduled_at."
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 32
                  example:
                    - spring-sale
                  description: "Optional. Your own labels, up to 10 (letters, digits, space _ . : -; up to 32 characters each; lowercased), for example a campaign or a flow. Stored on the message, sent on its webhook events, and reported by GET /v1/deliverability?group_by=tag. Filter with GET /v1/messages?tag=."
                consent:
                  type: object
                  description: "Optional. How the recipient agreed to your messages. A recurring non-marketing message from a number linked to a registration needs an opt-in on file for that registration; when none is, this records it and the message is sent. Never counts for marketing (use POST /v1/consent with proof). Not with scheduled_at."
                  required:
                    - source
                    - collected_at
                  properties:
                    source:
                      type: string
                      enum:
                        - web_form
                        - keyword
                        - paper
                        - checkout
                        - verbal
                      description: "How the recipient agreed"
                    collected_at:
                      type: string
                      description: "When they agreed: ISO timestamp or epoch ms, not in the future."
                    page_url:
                      type: string
                      format: uri
                      description: "Required for web_form: the page the form was on."
                media:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: "Reserved for MMS; currently returns 400 mms_not_enabled."
                status_callback:
                  type: string
                  format: uri
                  example: "https://example.com/sms/status"
                  description: "Optional. Also send this message's status events (message.sent, message.delivered, message.failed, message.blocked) to this https URL, signed with your callback secret (POST /v1/webhooks/callback_secret; 400 callback_secret_required until it exists). Logged and retried like a webhook endpoint, under endpoint `status_callback`. Immediate sends only."
      responses:
        201:
          description: "Message accepted"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Message
        202:
          description: "Accepted and not yet sent. Either a Message with status queued (a temporary carrier failure is being retried automatically, next_attempt_at set), or a ScheduledMessage with a `deferred` object (a message held for quiet hours, set for the recipient's next 8:00am)."
          content:
            "application/json":
              schema:
                oneOf:
                  - $ref: #/components/schemas/Message
                  - $ref: #/components/schemas/ScheduledMessage
        400:
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        403:
          description: "Refused by a send check: campaign_mismatch (the message is outside the sending number's registration: promotional wording or a marketing label on a non-marketing registration, anything but a one-time code from a two-factor registration, or a kind of message our registration check found does not match; with registration_id, use_case and mismatch, plus checked_by consistency_check and fingerprint when the check refused it), recipient_opted_out, quiet_hours (with recipient_local_time, timezone, send_after), consent_required (a marketing message, or a recurring message from a registered number, to a number with no opt-in on file: for the registration of the sending number when it has one, with registration_id and consent_scope), reconfirmation_pending / reconfirmation_expired (a marketing recipient not texted in 30 days is asked to confirm first; see /docs/compliance-checks), campaign_paused (marketing paused on the registration of the sending number, for a high opt-out rate), held_for_review (a new kind of message from an account in its first 30 days of live sending, or one the registration check could not place, held for our team to review; with held, fingerprint, registration_id and expires_at), review_rejected (a kind of message our team did not approve for the registration; with fingerprint), sender_not_registered, recipient_not_verified, spend_limit_reached, or forbidden (content, destination). The attempt is stored as a message with status blocked; its id is `message_id` in the error."
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Idempotency conflict"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        502:
          description: "The carrier permanently rejected the message (carrier_error)"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        503:
          description: "The content screen could not check the message (screen_unavailable), so it was not sent or charged; retry after Retry-After. Stored as a blocked message; its id is `message_id` in the error."
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    get:
      operationId: listMessages
      summary: "List messages"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: number
          in: query
          schema:
            type: string
          description: "Filter to messages to or from this number"
        - name: to
          in: query
          schema:
            type: string
          description: "Exact destination number (E.164)"
        - name: from
          in: query
          schema:
            type: string
          description: "Exact sending number (E.164)"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - sent
              - delivered
              - failed
              - blocked
              - received
          description: "Only messages with this status"
        - name: blocked_reason
          in: query
          schema:
            type: string
            enum:
              - account_closed
              - account_suspended
              - account_paused
              - opted_out
              - destination_not_allowed
              - voip_number
              - toll_free_destination
              - toll_free_unverified
              - sender_not_registered
              - campaign_mismatch
              - rate_limited
              - recipient_not_verified
              - quiet_hours
              - consent_required
              - reconfirmation_pending
              - reconfirmation_expired
              - campaign_paused
              - sender_rotation
              - content_blocked
              - screen_unavailable
              - held_for_review
              - review_rejected
              - review_expired
              - quota_exceeded
              - spend_limit_reached
              - insufficient_credits
              - billing_required
              - topic_unsubscribed
          description: "Blocked messages with this reason. Implies status=blocked."
        - name: failure_code
          in: query
          schema:
            type: string
          description: "Failed or blocked messages whose failure.code is this."
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - outbound
              - inbound
          description: "outbound (sent) or inbound (received)"
        - name: failure_code
          in: query
          schema:
            type: string
            enum:
              - carrier_filtered
              - unreachable
              - invalid_number
              - opted_out
              - campaign_mismatch
              - content_blocked
              - screen_unavailable
              - rate_limited
              - landline
              - carrier_rejected
              - spend_limit_reached
              - insufficient_credits
              - billing_required
              - sender_not_registered
              - quiet_hours
              - consent_required
              - reconfirmation_pending
              - reconfirmation_expired
              - held_for_review
              - review_rejected
              - review_expired
              - campaign_paused
              - sender_rotation
              - recipient_not_verified
              - quota_exceeded
              - destination_not_allowed
              - voip_number
              - toll_free_destination
              - toll_free_unverified
              - account_closed
              - account_suspended
              - account_paused
              - topic_unsubscribed
              - unknown
          description: "Filter to messages that failed for this reason (the `failure.code` on a message)"
        - name: created_after
          in: query
          schema:
            type: string
          description: "Inclusive. ISO timestamp or epoch ms."
        - name: created_before
          in: query
          schema:
            type: string
          description: "Exclusive. ISO timestamp or epoch ms."
        - name: customer_id
          in: query
          schema:
            type: string
          description: "Filter to one customer's messages"
        - name: schedule_id
          in: query
          schema:
            type: string
          description: "Filter to the occurrences of one recurring schedule (sch_...)"
        - name: tag
          in: query
          schema:
            type: string
          description: "Filter to messages sent with this tag"
      responses:
        200:
          description: "Messages, newest first"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Message
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/messages/{id}":
    get:
      operationId: getMessage
      summary: "Retrieve a message"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "The message"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Message
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    delete:
      operationId: deleteMessage
      summary: "Delete a message"
      description: "Deletes a finished message (delivered, failed, received, or sent with `receipt_status: \"missing\"`) and every copy of its text: the events about it, pending webhook retries, the request logs that carried it, and the conversation preview. Opt-out and consent records, usage and billing are kept, and a batch's results keep the message's outcome. Queued messages are refused (409 `invalid_state`): cancel a scheduled one with DELETE /scheduled_messages/{id}. Also refused: blocked messages, a message that is the proof of an opt-out or opt-in, and messages from a registration our team is reviewing. Recorded in the audit log as `message.deleted`. A key deletes only its own mode's messages."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deleted
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    enum:
                      - message
                  deleted:
                    type: boolean
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Not finished, blocked, consent evidence, or under review"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/messages/{id}/redact":
    post:
      operationId: redactMessage
      summary: "Redact a message"
      description: "Empties a finished message's `body` and `media` everywhere we keep them (the message, its events, pending webhook retries, request logs, the conversation preview, the carrier's receipt text) and keeps the record: status, timeline, segments, price and failure stay, and `redacted_at` is set. The same messages as DELETE /messages/{id} are refused. Safe to repeat. Recorded in the audit log as `message.redacted`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "The redacted message"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Message
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Not finished, blocked, consent evidence, or under review"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/batches":
    post:
      operationId: createBatch
      summary: "Send a batch"
      description: "One body to up to 10,000 recipients, each with its own merge variables (or to contacts by tag), sent as individual messages through the normal pipeline. Numbers are normalized, deduplicated and checked against opt-outs before queueing; rejected rows are returned with reasons. Set dry_run to validate without sending."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - body
              properties:
                from:
                  type: string
                  example: +15005550100
                  description: "One of your numbers, to pin the batch to it. Leave it out and TextKit picks a number approved for `category` (marketing unless you say otherwise), the same one per recipient. Nothing approved is a 400."
                body:
                  type: string
                  maxLength: 1600
                  example: "Hi {{first_name}}, your order {{order_id}} has shipped."
                  description: "The message text. Merge tags fill per recipient"
                name:
                  type: string
                  maxLength: 80
                  description: "A name for the broadcast"
                recipients:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required:
                      - to
                    properties:
                      to:
                        type: string
                        example: +14155550132
                        description: "Recipient's number in E.164"
                      variables:
                        type: object
                        additionalProperties:
                          type: string
                        example:
                          first_name: Jane
                          order_id: A-1042
                        description: "Merge values for this recipient, by name"
                  description: "Explicit recipients, up to 10,000"
                tags:
                  type: array
                  items:
                    type: string
                  description: "Send to contacts carrying any of these tags (instead of recipients)."
                contact_ids:
                  type: array
                  items:
                    type: string
                  description: "Send to these contacts, by id"
                segment_id:
                  type: string
                  description: "Send to the contacts in this saved segment, evaluated when the batch is created (instead of recipients)."
                list_id:
                  type: string
                  description: "Send to the contacts in this list, as it is when the batch is created (instead of recipients)."
                category:
                  type: string
                  enum:
                    - marketing
                    - transactional
                    - otp
                  description: "Optional. It can make the batch stricter (`marketing`), never looser: the sending number's registration and the wording decide ([which messages are marketing](/docs/compliance-checks#which-messages-are-marketing)). From a number with no registration, a batch is marketing."
                quiet_hours:
                  type: string
                  enum:
                    - block
                    - defer
                  description: "Optional. What to do with a message in the recipient's quiet hours: `block` refuses it (403 quiet_hours), `defer` holds it until their next 8:00am. Omitted: each recipient in quiet hours is held until their 8:00am."
                topic_id:
                  type: string
                  example: tp_marketing
                  description: "Subscription topic. Recipients unsubscribed from it are removed at validation (`topic_unsubscribed`) and skipped at send time, like opt-outs. Omit to apply opt-outs only."
                shorten_links:
                  type: boolean
                  description: "Optional. Rewrite every http(s) link to a tracked short link, per recipient, when each message is sent. Clicks show in GET /batches/{id}/results."
                scheduled_at:
                  type: string
                  description: "Future ISO timestamp or epoch ms, up to 30 days out."
                dry_run:
                  type: boolean
                  description: "Validate only: returns a BatchValidation and sends nothing."
                check_line_types:
                  type: boolean
                  description: "Reject landlines (first 500 unique numbers are checked)."
      responses:
        200:
          description: "Dry run result"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/BatchValidation
        201:
          description: "Batch created"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Batch
        400:
          description: "Invalid request or no valid recipients"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        403:
          description: "`from` not owned, or key mode does not match the number"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    get:
      operationId: listBatches
      summary: "List batches"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - scheduled
              - sending
              - paused
              - complete
              - canceled
          description: "Only batches with this status"
      responses:
        200:
          description: "Batches, newest first"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Batch
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/batches/{id}":
    get:
      operationId: getBatch
      summary: "Retrieve a batch"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "The batch with live counts"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Batch
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/batches/{id}/recipients":
    get:
      operationId: listBatchRecipients
      summary: "List a batch’s recipients"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - paused
              - sent
              - failed
              - skipped
              - canceled
          description: "Only recipients with this status"
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 500
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        200:
          description: "Recipients in upload order"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
