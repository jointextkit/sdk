                  object:
                    type: string
                    enum:
                      - topic_subscription
                  phone:
                    type: string
                  contact_id:
                    type: string
                    nullable: true
                  topic_id:
                    type: string
                  name:
                    type: string
                  subscribed:
                    type: boolean
                  changed:
                    type: boolean
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
