        mode:
          type: string
          enum:
            - test
            - live
          description: "Sandbox or live traffic. A key sees only its own mode's events, and an endpoint receives only its own mode's."
        created_at:
          type: string
          format: date-time
        data:
          type: object
          description: "The subject of the event. Events about one message (message.sent, .delivered, .failed, .received, .blocked) include `message_id`, its `price` (the same object GET /v1/messages/{id} shows) and its `tags` when it has any."
    TrackedEvent:
      type: object
      properties:
        id:
          type: string
          example: tev_a1B2c3D4e5F6g7H8
        object:
          type: string
          enum:
            - tracked_event
        event:
          type: string
        user_id:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: "Null when user_id is not linked to a number yet (nothing could start)."
        properties:
          type: object
        test:
          type: boolean
        runs_started:
          type: array
          items:
            type: string
          description: "Ids of the runs this event started."
        runs_notified:
          type: integer
          description: "Runs in progress for this person that recorded the event."
        created_at:
          type: string
          format: date-time
    AutomationStep:
      type: object
      required:
        - type
      description: "One of: send_sms {body, from?}; wait {seconds}; wait_for_event {event, timeout_seconds, on_received, on_timeout}; condition {check, on_met, on_not_met}; end. Branches are \"continue\", \"end\", or \"goto:<id of a later step>\"."
      properties:
        id:
          type: string
          description: "Stable handle for goto branches; assigned when omitted."
        type:
          type: string
          enum:
            - send_sms
            - wait
            - wait_for_event
            - condition
            - end
          description: "What the step does"
        body:
          type: string
          maxLength: 1600
          description: "send_sms. Merge fields: event properties by name, {{first_name}}, {{name}}, {{phone}}, {{field:<custom>}}."
        from:
          type: string
          description: "send_sms: overrides the flow sender."
        seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: "wait: how long, from 60 seconds to 30 days"
        event:
          type: string
          description: "wait_for_event: the event to wait for"
        timeout_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: "wait_for_event: how long to wait, from 60 seconds to 30 days"
        on_received:
          type: string
          example: end
          description: "wait_for_event: where to go when the event arrives: continue, end, or goto:<step id>"
        on_timeout:
          type: string
          example: continue
          description: "wait_for_event: where to go when time runs out: continue, end, or goto:<step id>"
        check:
          type: object
          description: "{kind: event_received, event} | {kind: property, property, op, value?} | {kind: contact_field, field, op, value?}. op: eq, neq, contains, gt, lt, exists, not_exists."
        on_met:
          type: string
          example: continue
          description: "condition: where to go when the check passes: continue, end, or goto:<step id>"
        on_not_met:
          type: string
          example: end
          description: "condition: where to go when the check fails: continue, end, or goto:<step id>"
    AutomationInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          description: "Automation name"
        from:
          type: string
          nullable: true
          description: "One of your numbers, to pin the flow to it. Leave it out and TextKit picks a number approved for `category`. A sandbox number makes it a sandbox flow."
        category:
          type: string
          nullable: true
          enum:
            - marketing
            - transactional
            - otp
          description: "What it sends: marketing, alerts (transactional) or codes (otp). With no `from`, TextKit picks a number approved for this. Falls back to a built-in topic."
        topic_id:
          type: string
          nullable: true
          description: "Skip recipients unsubscribed from this topic."
        trigger:
          type: object
          properties:
            event:
              type: string
              example: trial_started
              description: "The tracked event that starts a run"
            filters:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  property:
                    type: string
                    description: "The event property to check"
                  op:
                    type: string
                    description: "eq, neq, contains, gt, lt, exists or not_exists"
                  value:
                    description: "The value to compare with. Not used by exists or not_exists"
              description: "Up to 5 checks on the event's properties. All must hold"
            cooldown_seconds:
              type: integer
              minimum: 60
              maximum: 7776000
              description: "Optional. After a run starts for a person, they do not start another for this long (for events that repeat, like a paywall view)."
          description: "What starts a run: an event, with optional filters"
        steps:
          type: array
          maxItems: 20
          items:
            $ref: #/components/schemas/AutomationStep
          description: "Up to 20 steps, run in order"
    AutomationUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          description: "Automation name"
        from:
          type: string
          nullable: true
          description: "One of your numbers, to pin the flow to it. Leave it out and TextKit picks a number approved for `category`. A sandbox number makes it a sandbox flow."
        category:
          type: string
          nullable: true
          enum:
            - marketing
            - transactional
            - otp
          description: "What it sends: marketing, alerts (transactional) or codes (otp). With no `from`, TextKit picks a number approved for this. Falls back to a built-in topic."
        topic_id:
          type: string
          nullable: true
          description: "Skip recipients unsubscribed from this topic."
        trigger:
          type: object
          properties:
            event:
              type: string
              example: trial_started
              description: "The tracked event that starts a run"
            filters:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  property:
                    type: string
                    description: "The event property to check"
                  op:
                    type: string
                    description: "eq, neq, contains, gt, lt, exists or not_exists"
                  value:
                    description: "The value to compare with. Not used by exists or not_exists"
              description: "Up to 5 checks on the event's properties. All must hold"
            cooldown_seconds:
              type: integer
              minimum: 60
              maximum: 7776000
              description: "Optional. After a run starts for a person, they do not start another for this long (for events that repeat, like a paywall view)."
          description: "What starts a run: an event, with optional filters"
        steps:
          type: array
          maxItems: 20
          items:
            $ref: #/components/schemas/AutomationStep
          description: "Replaces every step."
        step:
          $ref: #/components/schemas/AutomationStep
          description: "Replaces only the existing step with this `id`; the others stay as they are. Not with `steps`."
        if_updated_at:
          type: string
          format: date-time
          description: "The automation's `updated_at` as you read it. If it changed since (another edit), nothing is saved and the answer is 409: read it again and redo the edit on the latest."
    Automation:
      type: object
      properties:
        id:
          type: string
          example: auto_a1B2c3D4e5F6
        object:
          type: string
          enum:
            - automation
        name:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - paused
        trigger:
          type: object
        steps:
          type: array
          items:
            $ref: #/components/schemas/AutomationStep
        from:
          type: string
          nullable: true
          description: "Null when TextKit picks the number."
        sender:
          type: object
          description: "Who it comes from."
          properties:
            automatic:
              type: boolean
              description: "True when TextKit picks the number."
            category:
              type: string
              nullable: true
            numbers:
              type: array
              items:
                type: string
              description: "The numbers it sends from right now. Each recipient keeps one."
            blocked:
              type: string
              nullable: true
              description: "Why it cannot send: nothing is approved for this yet."
        category:
          type: string
          nullable: true
        topic_id:
          type: string
          nullable: true
        test:
          type: boolean
          nullable: true
          description: "Sandbox or live."
        version:
          type: integer
          description: "Published version; runs are pinned to the one they started on."
        unpublished_changes:
          type: boolean
        stats:
          type: object
          properties:
            runs_started:
              type: integer
            runs_active:
              type: integer
            runs_completed:
              type: integer
            runs_failed:
              type: integer
            runs_opted_out:
              type: integer
            triggers_skipped:
              type: integer
              description: "Triggers ignored because that person already had a run in progress."
            messages_sent:
              type: integer
            last_triggered_at:
              type: string
              format: date-time
              nullable: true
        issues:
          type: array
          description: "What stops this flow from running. Empty when it can be activated. Includes merge fields no tracked trigger event carries (they would send empty)."
          items:
            type: object
            properties:
              where:
                type: string
                description: "A step id, \"trigger\" or \"flow\"."
              field:
                type: string
              message:
                type: string
        warnings:
          type: array
          description: "What could not be checked yet, such as merge fields before any trigger event has been tracked. Never blocks activation."
          items:
            type: object
            properties:
              where:
                type: string
              field:
                type: string
              message:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AutomationRun:
      type: object
      properties:
        id:
          type: string
          example: run_1790000000000a1B2c3D4
        object:
          type: string
          enum:
            - automation_run
        automation_id:
          type: string
        automation_version:
          type: integer
        status:
          type: string
          enum:
