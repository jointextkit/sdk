  "/deliverability":
    get:
      operationId: getDeliverability
      summary: "Delivery rates by day, carrier, number, country, category, customer, or error code"
      description: "Final outcomes (delivered/failed) aggregated over a UTC date range of up to 90 days. Test keys report sandbox traffic, live keys live traffic. `country` is the destination (US or CA), `category` the message category (`none` when unset), `customer` your platform customer id (`none` when unset), `error_code` our failure code (failed messages only, most frequent first), and `tag` the tags you sent with each message (one row per tag, `_untagged` for messages without; a message with two tags counts in both rows, so rows can add up to more than the totals). Those five are recorded from 2026-10-24. Scope: messages:read."
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum:
              - day
              - carrier
              - number
              - country
              - category
              - customer
              - error_code
              - tag
            default: day
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: "Default: 6 days before end_date"
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: "Default: today (UTC)"
      responses:
        200:
          description: "Deliverability report"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Deliverability
        400:
          description: "Invalid range or group_by"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/balance":
    get:
      operationId: getBalance
      summary: "Get the prepaid credit balance and auto-recharge setting"
      description: "Billable live calls draw the balance down; a call it cannot cover answers 402 insufficient_credits and is not charged. Amounts ending in _micro_usd are millionths of a dollar. Scope: billing."
      responses:
        200:
          description: Balance
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - balance
                  balance_micro_usd:
                    type: integer
                    example: 12340000
                  balance_usd:
                    type: number
                    example: 12.34
                  currency:
                    type: string
                    enum:
                      - usd
                  low_balance_usd:
                    type: number
                    example: 5
                    description: "credits.low fires when the balance falls below this"
                  auto_recharge:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      threshold_usd:
                        type: number
                        example: 10
                      amount_usd:
                        type: number
                        example: 20
                  top_up_url:
                    type: string
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/spend-limit":
