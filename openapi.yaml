  "/audit-logs":
    get:
      operationId: listAuditLogs
      summary: "List audit log entries"
      description: "Account changes (keys, team, webhooks, spend limit, numbers, consent, settings) with actor and IP, newest first. Filters apply before paging. One request scans at most 5,000 entries, so a rarely matching filter can return a short or empty page with has_more true: follow next_cursor until has_more is false. Scope: audit_logs:read."
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: "Max results (default 25, max 100)"
        - name: cursor
          in: query
          schema:
            type: string
          description: "next_cursor from the previous page"
        - name: action
          in: query
          description: "One action, or a group prefix with a trailing dot (team., api_key.)"
          schema:
            type: string
            example: api_key.created
        - name: actor
          in: query
          description: "Actor id (exact) or part of the actor email (case-insensitive)"
          schema:
            type: string
            example: "dev@example.com"
        - name: target_type
          in: query
          description: "Target type, e.g. api_key, member, invite, webhook, number, phone"
          schema:
            type: string
            example: webhook
        - name: created_after
          in: query
          description: "Entries at or after this time (ISO 8601)"
          schema:
            type: string
            format: date-time
            example: "2026-09-01T00:00:00Z"
        - name: created_before
          in: query
          description: "Entries at or before this time (ISO 8601); a bare date means the end of that day (UTC)"
          schema:
            type: string
            format: date-time
            example: "2026-09-30T23:59:59Z"
      responses:
        200:
          description: "Audit log entries, newest first"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/AuditLog
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
        400:
          description: "Invalid filter"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/exports/{kind}":
    get:
      operationId: exportCsv
      summary: "Export messages, delivery results, events, opt-outs, webhook deliveries, usage, credit history or the audit log as CSV"
      description: "Streams a CSV (UTF-8 with BOM). At most 50,000 rows per export (header X-Export-Row-Cap); narrow the date range if you hit it. Cells that would be spreadsheet formulas are prefixed with a single quote."
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - messages
              - deliveries
              - events
              - opt_outs
              - webhook_deliveries
              - usage
              - usage_monthly
              - audit_log
              - credit_history
        - name: from
          in: query
          description: "ISO date/time or epoch ms (messages, deliveries, events, webhook_deliveries)"
          schema:
            type: string
            example: 2026-01-01
        - name: to
          in: query
          description: "Inclusive; a bare date means the end of that day (UTC)"
          schema:
            type: string
            example: 2026-01-31
        - name: status
          in: query
          description: "messages, deliveries"
          schema:
            type: string
            enum:
              - queued
              - sent
              - delivered
              - failed
              - blocked
              - received
        - name: blocked_reason
          in: query
          description: "messages, deliveries: blocked messages with this reason"
          schema:
            type: string
        - name: direction
          in: query
          description: messages
          schema:
            type: string
            enum:
              - outbound
              - inbound
        - name: number
          in: query
          description: "messages, deliveries: digits matched against either side"
          schema:
            type: string
        - name: to_number
          in: query
          description: "messages, deliveries: exact recipient (E.164). `to`/`from` are the date range here."
          schema:
            type: string
        - name: from_number
          in: query
          description: "messages, deliveries: exact sender (E.164)"
          schema:
            type: string
        - name: customer_id
          in: query
          description: "messages, deliveries"
          schema:
            type: string
        - name: failure_code
          in: query
          description: "messages, deliveries: failed for this reason (the `failure.code` on a message)"
          schema:
            type: string
            enum:
              - carrier_filtered
              - unreachable
              - invalid_number
              - opted_out
              - campaign_mismatch
              - content_blocked
              - screen_unavailable
              - rate_limited
              - landline
              - carrier_rejected
              - spend_limit_reached
              - insufficient_credits
              - billing_required
              - sender_not_registered
              - quiet_hours
              - consent_required
              - reconfirmation_pending
              - reconfirmation_expired
              - held_for_review
              - review_rejected
              - review_expired
              - campaign_paused
              - sender_rotation
              - recipient_not_verified
              - quota_exceeded
              - destination_not_allowed
              - voip_number
              - toll_free_destination
              - toll_free_unverified
              - account_closed
              - account_suspended
              - account_paused
              - topic_unsubscribed
              - unknown
        - name: batch
          in: query
          description: "messages, deliveries: batch id (bc_...)"
          schema:
            type: string
        - name: q
          in: query
          description: "messages: body/failure text; events: id/payload text"
          schema:
            type: string
        - name: type
          in: query
          description: "events, webhook_deliveries"
          schema:
            type: string
            example: message.failed
        - name: endpoint_id
          in: query
          description: "webhook_deliveries (default: all endpoints)"
          schema:
            type: string
        - name: ok
          in: query
          description: webhook_deliveries
          schema:
            type: boolean
        - name: months
          in: query
          description: "usage: daily rows for the last N months"
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 3
        - name: action
          in: query
          description: "audit_log: one action, or a group prefix with a trailing dot (team.)"
          schema:
            type: string
        - name: actor
          in: query
          description: "audit_log: actor id or part of the actor email"
          schema:
            type: string
        - name: target_type
          in: query
          description: audit_log
          schema:
            type: string
        - name: created_after
          in: query
          description: "audit_log: same as on GET /audit-logs (from is accepted too)"
          schema:
            type: string
        - name: created_before
          in: query
          description: "audit_log: same as on GET /audit-logs (to is accepted too)"
          schema:
            type: string
      responses:
        200:
          description: "CSV body"
          content:
            "text/csv":
              schema:
                type: string
        400:
          description: "Unknown kind or invalid filter"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/track":
    post:
      operationId: trackEvent
      summary: "Track a customer event"
      description: "Records something a person did in your app and starts or advances the automations listening for it. Pass phone, user_id, or both; a call with both links them so later events need only user_id. Test keys reach sandbox automations, live keys live ones. Supports Idempotency-Key. 100 calls per 10 seconds per key. Scope: automations. (GET /events is the webhook event log, a different thing.)"
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  type: string
                  maxLength: 64
                  example: trial_started
                  description: "Letters, digits, and _ . : -"
                user_id:
                  type: string
                  maxLength: 128
                  example: 123
                  description: "Your id for the person. Sent with phone, it links the two, so later events need only user_id"
                phone:
                  type: string
                  example: +14155550132
                  description: "The person's number in E.164"
                properties:
                  type: object
                  description: "Up to 20 scalar values; usable as merge fields and in conditions."
                  example:
                    plan: pro
      responses:
        201:
          description: Recorded
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/TrackedEvent
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/schedules":
    get:
      operationId: listSchedules
      summary: "List recurring schedules (at most 100 per account)"
      description: "Scope: messages:read."
      responses:
        200:
          description: "Schedules, newest first"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Schedule
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    post:
      operationId: createSchedule
      summary: "Create a recurring schedule"
      description: "Sends one message to one number on a repeating wall-clock time in an IANA time zone, correct across daylight saving. Each occurrence goes through the same checks as POST /messages at the moment it fires (opt-out, sender registration, quota, spend limit, content screening) and is a normal message with `schedule_id`. A local time that does not exist (spring forward) runs after the gap that day; one that occurs twice (fall back) runs once, the first time. An occurrence reached more than 1 hour late is skipped (`skipped_missed`), never sent late. Limits: 25 active and 100 total schedules per account, at most one message per local day per schedule. Supports the Idempotency-Key header. Scope: messages:send."
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: "Makes retries safe for 24 hours: the same key and body replays the original successful response (with Idempotent-Replayed: true); a different body returns 409. Failed requests release the key."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: #/components/schemas/ScheduleInput
      responses:
        201:
          description: Created
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Schedule
        400:
          description: "Invalid request, or a limit reached"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Idempotency conflict"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/schedules/{id}":
    get:
      operationId: getSchedule
      summary: "Retrieve a schedule, with its recent occurrences"
      description: "Scope: messages:read."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "The schedule"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Schedule
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    patch:
      operationId: updateSchedule
      summary: "Change, pause or resume a schedule"
      description: "`active: false` pauses; `active: true` resumes from now (nothing that came due while paused is sent). Any of to, from, body, repeat (the whole object), start_date, end_date, max_occurrences can be changed in the same call. Scope: messages:send."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              allOf:
                - $ref: #/components/schemas/ScheduleInput
              properties:
                active:
                  type: boolean
                  description: "false pauses, true resumes."
              required: []
      responses:
        200:
          description: Updated
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Schedule
        400:
          description: "Invalid request, or the active-schedule limit reached"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Cannot resume: no occurrences left (invalid_state)"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    delete:
      operationId: deleteSchedule
      summary: "Delete a schedule"
      description: "Stops it for good and deletes its occurrence records. Messages it already sent stay in the message log. Scope: messages:send."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
