  "/registrations/{id}/submit":
    post:
      operationId: submitRegistration
      summary: "Submit a ready registration for carrier review (or resubmit after a rejection)"
      description: "The body must carry `fees_acknowledged: true`: your acceptance of the registration fee terms (Terms §4.3). Carrier registration fees (brand, vetting, the monthly campaign fee) are separate from the per-message rate and billed at what the registry or carrier charges us; a campaign is billed for a minimum of 3 months; the fees are non-refundable, including if the registration is rejected. The acknowledgment is recorded on the filed copy with its wording, the time and your IP; without it the request is refused with 400 invalid_request (param fees_acknowledged) and nothing is filed. The first submit for a business also carries the signed business attestation; without one on file the submit answers 400 attestation_required (param attestation). The submission is then held while our team verifies the business (guidance.next_actor textkit), and filed once it is verified. Later submits for the same business details need no attestation. A business we could not verify returns the registration as rejected with reason code business_unverified; the next submit is signed again."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - fees_acknowledged
              properties:
                fees_acknowledged:
                  type: boolean
                  enum:
                    - true
                  description: "Must be true. Confirms the registration fee terms above."
                attestation:
                  $ref: #/components/schemas/BusinessAttestation
      responses:
        200:
          description: "Registration, status submitted"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Registration
        400:
          description: "invalid_request: fees_acknowledged missing or not true (param fees_acknowledged), or a missing business detail or attestation field; attestation_required: the business has no signature on file for these details"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
