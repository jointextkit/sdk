  "/webhooks":
    get:
      operationId: listWebhookEndpoints
      summary: "List webhook endpoints"
      description: "Your endpoints. Signing secrets are never listed: one is returned once, by the POST that creates the endpoint. Scope: webhooks."
      responses:
        200:
          description: Endpoints
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/WebhookEndpoint
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
                    nullable: true
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    post:
      operationId: createWebhookEndpoint
      summary: "Create a webhook endpoint"
      description: "Registers a URL to receive events. Same rules as the console: https only, a publicly reachable host, known event types, at most 5 endpoints per account. The response includes `secret`, the signing secret: this is the only time the API returns it. Recorded in the audit log as webhook.created. Scope: webhooks:write."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://example.com/webhooks/textkit"
                  description: "The https URL that receives the events"
                events:
                  description: "Event types to receive. Omit, or send \"*\" or [], for every event. An unknown type is a 400."
                  oneOf:
                    - type: string
                      enum:
                        - "*"
                    - type: array
                      items:
                        type: string
                      example:
                        - message.received
                        - message.delivered
                description:
                  type: string
                  maxLength: 120
                  description: "A note on what the endpoint is for"
                numbers:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    example: +14155550132
                  description: "Optional. Only events about these of your numbers (E.164): message events by their from/to, number events by phone_number. Events about no number (batches, credits, registrations) go only to endpoints without a filter. Omit or [] for every number."
      responses:
        201:
          description: "The endpoint, with its signing secret (shown once)"
          content:
            "application/json":
              schema:
                allOf:
                  - $ref: #/components/schemas/WebhookEndpoint
                  - type: object
                    properties:
                      secret:
                        type: string
                        example: whsec_a1B2c3D4e5F6g7H8a1B2c3D4e5F6g7H8
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/webhooks/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: we_a1B2c3D4e5F6
    get:
      operationId: getWebhookEndpoint
      summary: "Get a webhook endpoint"
      description: "One endpoint, without its signing secret. Scope: webhooks:write."
      responses:
        200:
          description: "The endpoint"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/WebhookEndpoint
        401:
