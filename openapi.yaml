                  phone:
                    type: string
                  contact_id:
                    type: string
                    nullable: true
                  consent_status:
                    type: string
                    enum:
                      - opted_out
                      - opted_in
                      - no_record
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/TopicSubscription
