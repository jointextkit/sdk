            - end_step
            - branch_end
            - opted_out
            - flow_deleted
            - version_removed
            - expired
            - canceled
            - error
            - null
        messages_sent:
          type: integer
        messages_failed:
          type: integer
        timeline:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              type:
                type: string
                enum:
                  - started
                  - sent
                  - send_failed
                  - send_unconfirmed
                  - send_skipped
                  - wait_started
                  - wait_done
                  - waiting_for_event
                  - event_received
                  - timed_out
                  - condition_met
                  - condition_not_met
                  - ended
              step_id:
                type: string
              detail:
                type: string
              message_id:
                type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
    Template:
      type: object
      properties:
        id:
          type: string
          example: tpl_a1B2c3D4e5F6
        object:
          type: string
          enum:
            - template
        name:
          type: string
        body:
          type: string
          description: "Merge fields: {{name}}, {{first_name}}, {{phone}}, {{field:<custom>}}"
