            total:
              type: integer
            queued:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            opted_out:
              type: integer
            canceled:
              type: integer
        rejected:
          type: object
          nullable: true
          description: "Rows dropped at validation (not part of total), by reason."
        variables:
          type: array
          items:
            type: string
        retries:
          type: integer
    BatchRecipient:
      type: object
      properties:
        id:
          type: string
          example: r00042
        object:
          type: string
          enum:
            - batch_recipient
        to:
          type: string
        status:
          type: string
          enum:
            - queued
            - paused
            - sent
            - failed
            - skipped
            - canceled
        error:
          type: string
          nullable: true
