            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/contacts/{id}":
    get:
      operationId: getContact
      summary: "Retrieve a contact"
      description: "Includes `consent_status`, each topic's subscription, and the saved segments the contact is in right now. `id` may also be the contact's phone number."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: "The contact"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Contact
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    patch:
      operationId: updateContact
      summary: "Update a contact"
      description: "Only the fields sent change. tags and fields replace what is stored; null clears name or notes, and null or an empty string clears any other optional property."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                phone_number:
                  type: string
                  description: "E.164, US or Canada"
                name:
                  type: string
                  maxLength: 120
                  nullable: true
                  description: "Display name. Null clears it"
                tags:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 40
                  description: "Labels that group contacts"
                fields:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 500
                  description: "Up to 20 string values"
                notes:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: "Free-text notes. Null clears them"
                first_name:
                  type: string
                  maxLength: 80
