        scopes:
          type: array
          items:
            type: string
          description: "Empty = full access"
        status:
          type: string
          enum:
            - active
            - paused
            - revoked
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    ScheduledMessage:
      type: object
