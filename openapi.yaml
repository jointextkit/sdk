          properties:
            reason:
              type: string
              enum:
                - quiet_hours
            recipient_local_time:
              type: string
              example: "22:41"
              description: "24-hour wall clock in `timezone`."
            timezone:
              type: string
              example: America/New_York
              description: "IANA zone read from the area code of the number."
            send_after:
              type: string
              format: date-time
            category:
              type: string
              enum:
                - marketing
            category_basis:
              type: string
              enum:
                - request
                - broadcast
                - sender_registration
        status:
          type: string
          enum:
            - queued
            - canceled
        batch_id:
          type: string
          nullable: true
    ScheduleRepeat:
      type: object
      required:
        - frequency
        - time
        - timezone
      properties:
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - monthly
          description: "How often it sends"
        time:
          type: string
          example: "08:00"
          description: "24-hour wall-clock time, HH:MM, in `timezone`."
        timezone:
          type: string
          example: America/New_York
          description: "IANA time zone."
        days_of_week:
          type: array
          items:
            type: string
            enum:
              - sun
              - mon
              - tue
              - wed
              - thu
              - fri
              - sat
          description: "Weekly only, required: which weekdays."
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: "Monthly only, required. Months without that day run on their last day."
      description: "When it sends: how often, the local time and the time zone"
    ScheduleInput:
      type: object
      required:
        - to
        - body
        - repeat
      properties:
        to:
          type: string
          example: +14155550132
          description: "Recipient's number in E.164"
        from:
          type: string
          description: "One of your numbers. Optional when the account has exactly one number for the key's mode."
        body:
          type: string
          maxLength: 1600
          description: "The text sent each time"
        repeat:
          $ref: #/components/schemas/ScheduleRepeat
        start_date:
          type: string
          format: date
          nullable: true
          description: "First local date it may run. Defaults to today."
        end_date:
          type: string
          format: date
          nullable: true
          description: "Last local date it may run (inclusive)."
        max_occurrences:
          type: integer
          minimum: 1
          nullable: true
          description: "The schedule completes after this many messages have been sent."
        category:
          type: string
          nullable: true
          enum:
            - marketing
            - transactional
            - otp
          description: "Optional. It can make each occurrence stricter (`marketing`), never looser: the sending number's registration and the wording decide ([which messages are marketing](/docs/compliance-checks#which-messages-are-marketing))."
        quiet_hours:
          type: string
          nullable: true
          enum:
            - block
            - defer
          description: "Optional. What to do with a message in the recipient's quiet hours: `block` refuses it (403 quiet_hours), `defer` holds it until their next 8:00am. Omitted: an occurrence in quiet hours is held until the recipient's 8:00am and recorded as `deferred`."
    Schedule:
      type: object
      properties:
        id:
          type: string
          example: sch_a1B2c3D4e5F6g7H8
        object:
          type: string
          enum:
            - schedule
        to:
          type: string
        from:
          type: string
        body:
          type: string
        repeat:
          $ref: #/components/schemas/ScheduleRepeat
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        max_occurrences:
          type: integer
          nullable: true
        category:
          type: string
          nullable: true
          enum:
            - marketing
            - transactional
            - otp
            - null
        quiet_hours:
          type: string
          nullable: true
          enum:
            - block
            - defer
            - null
        active:
