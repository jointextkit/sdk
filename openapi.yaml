    post:
      operationId: testWebhookEndpoint
      summary: "Send a test event to a webhook endpoint"
      description: "Sends a signed `test.ping` event now and returns what the endpoint answered. Test pings are not stored as events (they cannot be replayed) but the attempt shows in the delivery log. Scope: webhooks:write."
