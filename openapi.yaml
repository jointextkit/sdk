  "/numbers/bulk":
    post:
      operationId: bulkUpdateNumbers
      summary: "Act on many numbers at once"
      description: "Tag, untag, label, pool, unpool or release up to 1000 numbers (100 for release). Returns 200 with a result per id even when some fail. Release requires `confirm: \"RELEASE <count of ids>\"`; test keys cannot release live numbers."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - ids
                - action
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  maxItems: 1000
                  example:
                    - +15005550132
                    - +15005550154
                  description: "Numbers to act on, in E.164"
                action:
                  type: string
                  enum:
                    - add_to_pool
                    - remove_from_pool
                    - add_tags
                    - remove_tags
                    - set_label
                    - release
                  description: "add_to_pool and remove_from_pool take pool_id, add_tags and remove_tags take tags, set_label takes label, release takes confirm"
                pool_id:
                  type: string
                  description: "add_to_pool / remove_from_pool"
                tags:
                  type: array
                  items:
                    type: string
                  description: "add_tags / remove_tags. Lowercased; up to 20 per number."
                label:
                  type: string
                  nullable: true
                  maxLength: 64
                  description: "set_label; null clears"
                confirm:
                  type: string
                  example: "RELEASE 2"
                  description: "release only"
      responses:
        200:
          description: "Per-id results"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/BulkResult
        400:
          description: "Malformed request or missing release confirmation"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/numbers/bulk-purchase":
    post:
      operationId: bulkPurchaseNumbers
      summary: "Buy many numbers in an area code"
      description: "Quota is checked for the whole quantity up front (429, nothing bought). After that, carrier refusals are reported per number and backfilled from spare inventory; `shortfall` counts any the area code could not supply. Test keys mint sandbox numbers. Supports the Idempotency-Key header: a retried request replays the original response instead of buying again."
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: "Makes retries safe for 24 hours: the same key and body replays the original successful response (with Idempotent-Replayed: true); a different body returns 409. Failed requests release the key."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - area_code
                - quantity
              properties:
                area_code:
                  type: string
                  example: 415
                  description: "Three-digit area code to buy in"
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: "How many numbers to buy (1 to 50)"
                pool_id:
                  type: string
                  description: "Add the new numbers to this pool"
                tags:
                  type: array
                  items:
                    type: string
                  description: "Tags to put on the new numbers"
      responses:
        201:
          description: "At least one number purchased"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - bulk_purchase
                  requested:
                    type: integer
                  purchased:
                    type: array
                    items:
                      $ref: #/components/schemas/Number
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        phone_number:
                          type: string
                        error:
                          type: string
                        message:
                          type: string
                  shortfall:
                    type: integer
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Idempotency conflict"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
