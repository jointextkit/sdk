  "/automations/{id}/preview":
    get:
      operationId: previewAutomation
      summary: "Preview an automation"
      description: "Every send_sms step as it would go out, without sending anything. Works on drafts. Merge fields are filled from the sample event `properties` and, with `to`, that contact; the brand and opt-out wording we would add are added, in step order. Each step gives the final text, segments, encoding, estimated cost, and any merge field that would come out empty."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: properties
          in: query
          schema:
            type: string
          description: "Sample event properties: a JSON object, e.g. {\"plan\":\"pro\",\"amount\":9.99}"
        - name: to
          in: query
          schema:
            type: string
          description: "E.164. Fills contact merge fields and reads what this person has already been shown"
      responses:
        200:
          description: "The rendered texts"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - automation_preview
                  automation_id:
                    type: string
                  status:
                    type: string
                  trigger_event:
                    type: string
                  from:
                    type: string
                    nullable: true
                    description: "The number this text would go from; with `to`, that person's."
                  sender:
                    type: object
                    description: "Who it comes from."
                    properties:
                      automatic:
                        type: boolean
                        description: "True when TextKit picks the number."
                      category:
                        type: string
                        nullable: true
                      numbers:
                        type: array
                        items:
                          type: string
                        description: "The numbers it sends from right now. Each recipient keeps one."
                      blocked:
                        type: string
                        nullable: true
                        description: "Why it cannot send: nothing is approved for this yet."
                  to:
                    type: string
                    nullable: true
                  test:
                    type: boolean
                    nullable: true
                  contact_found:
                    type: boolean
                  properties:
                    type: object
                    additionalProperties: true
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step_id:
                          type: string
                        index:
                          type: integer
                        template:
                          type: string
                        text:
                          type: string
                          nullable: true
                          description: "What the recipient would read. Null when the step would be skipped"
                        skipped:
                          type: string
                          nullable: true
                          enum:
                            - empty_after_merge
                            - null
                        disclosures_added:
                          type: array
                          items:
                            type: string
                            enum:
                              - brand
                              - opt_out
                        merge_fields:
                          type: array
                          items:
                            type: string
                        empty_merge_fields:
                          type: array
                          items:
                            type: string
                        segments:
                          type: integer
                        encoding:
                          type: string
                          enum:
                            - GSM-7
                            - UCS-2
                        characters:
                          type: integer
                        estimated_cost_usd:
                          type: number
                        names_brand:
                          type: boolean
                          nullable: true
                        from:
                          type: string
                          nullable: true
                  total_segments:
                    type: integer
                  estimated_cost_usd:
                    type: number
        400:
          description: "Invalid properties or to"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/automations/{id}/test":
    post:
      operationId: testAutomation
      summary: "Send an automation as a test"
      description: "Sends the automation's texts to `to` now, one after another, skipping waits and conditions. Works on drafts and active automations and does not activate them; no run starts and its stats do not change. `to` must be your own verified phone or a verified recipient. Texts are tagged automation_test and are billed like any text. Honors Idempotency-Key."
