        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - from
                - body
              properties:
                to:
                  type: string
                  description: "One of your sandbox numbers (never a live number). Optional while the account has one sandbox number."
                from:
                  type: string
                  description: "Who the simulated text comes from, in E.164"
                body:
                  type: string
                  description: "The text of the simulated message"
      responses:
