  "/contacts/{id}/topics/{topic}":
    put:
      operationId: setContactTopic
      summary: "Subscribe or unsubscribe a contact from a topic"
      description: "`topic` is a topic id or name. Recorded in the consent ledger and the audit log. No record means subscribed, so only an unsubscribe narrows who is sent to. Subscribing to a topic does not lift an opt-out."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Contact id or phone number"
        - name: topic
          in: path
          required: true
          schema:
            type: string
          description: "Topic id (tp_...) or name"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - subscribed
              properties:
                subscribed:
                  type: boolean
                  description: "true subscribes the contact to the topic, false unsubscribes them"
                source:
                  type: string
                  description: "Where the change came from, e.g. \"preference_page\". Default \"api\"."
      responses:
        200:
          description: "The new state; `changed` is false when it already was"
          content:
            "application/json":
              schema:
                type: object
