        accepted:
          type: boolean
          description: "Must be true: the person signing agrees to the statement."
    TollFreeVerificationInput:
      type: object
      description: "The carriers' toll-free verification form, field for field. Every field is optional on each call: what you leave out keeps what we filled in. The HELP and STOP replies, example messages, program and opt-in descriptions and advertising answer follow your business name and use case until you set them yourself. Unknown fields are ignored."
      properties:
        numbers:
          type: array
          items:
            type: string
          example:
            - +18335550100
          description: "Your live toll-free numbers this program texts from, E.164. One per business unless multiple_numbers_reason says why."
        multiple_numbers_reason:
          type: string
          description: "Why the program needs more than one number (one per store, say). Required with more than one number."
        business_name:
          type: string
          example: "Acme Plumbing LLC d/b/a Acme"
          description: "The legal name, as on the IRS EIN letter, optionally with \"d/b/a\" and the brand your messages carry."
        ein:
          type: string
          example: 12-3456789
          description: "The EIN (US), matching the legal name; elsewhere the business registration number."
        entity_type:
          type: string
          enum:
            - PRIVATE_PROFIT
            - PUBLIC_PROFIT
            - NON_PROFIT
            - GOVERNMENT
            - SOLE_PROPRIETOR
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
          example: "United States"
        contact_first_name:
          type: string
        contact_last_name:
          type: string
        contact_phone:
          type: string
        brand_email:
          type: string
          description: "The business's own email, for its customers: the HELP reply and the hosted opt-in page name it."
        website:
          type: string
          format: uri
        use_case:
          type: string
          enum:
            - 2fa
            - account_notification
            - customer_care
            - delivery_notification
            - fraud_alert
            - higher_education
            - marketing
            - mixed
            - polling_voting
            - public_service_announcement
            - security_alert
            - low_volume
        use_case_summary:
          type: string
          maxLength: 1500
          description: "What the program sends, to whom and why. At least 40 characters."
        sample_messages:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 640
          description: "At least two example messages."
        help_reply:
          type: string
        stop_reply:
          type: string
        opt_in_description:
          type: string
          maxLength: 2000
          description: "How people opt in, step by step. At least 40 characters."
        opt_in_url:
          type: string
          format: uri
          description: "The opt-in page. With none of your own we make you a hosted one."
        monthly_volume:
          type: string
          example: "About 1,000 messages per month"
        volume_basis:
          type: string
          enum:
            - existing
            - projecting
        advertising:
          type: string
          enum:
            - yes
            - no
            - unsure
          description: "Whether the messages advertise a product or service."
        previous_service:
          type: string
          enum:
            - new
            - short_code
            - long_number
          description: "Where this traffic ran before."
        previous_content:
          type: string
          maxLength: 2000
          description: "Sample messages from the previous service (not new only)."
        previous_numbers:
          type: string
          description: "The numbers it used (not new only)."
        number_published:
          type: string
          description: "Where people see this number."
        fortune_500:
          type: boolean
        urls_in_messages:
          type: string
          description: "Links your messages include, or \"None\"."
        phones_in_messages:
          type: string
          description: "Phone numbers your messages include, or \"None\"."
        terms_url:
          type: string
          format: uri
        privacy_url:
          type: string
          format: uri
    TollFreeVerification:
      type: object
      properties:
        id:
          type: string
          example: tfv_a1B2c3D4e5F6
        object:
          type: string
          enum:
            - toll_free_verification
        status:
          type: string
          enum:
            - draft
            - in_review
            - submitted
            - verified
            - rejected
          description: "draft: not submitted. in_review: our team is checking it by hand; nothing has gone to the carriers yet. submitted: we sent it to the carriers; waiting on their answer. verified: its numbers text anyone who opted in. rejected: sent back; rejection.reason says why."
        numbers:
          type: array
          items:
            type: string
          example:
            - +18335550100
        business_name:
          type: string
        ready:
          type: boolean
          description: "Nothing the carriers require is missing (problems is empty)."
        problems:
          type: array
          description: "What the carriers would send it back for, one entry per answer to fix."
          items:
            type: object
            properties:
              field:
                type: string
                example: ein
              message:
                type: string
        editable:
          type: boolean
          description: "Whether PATCH may change it now (draft, in_review and rejected)."
        next_actor:
          type: string
          enum:
            - you
            - textkit
            - carriers
            - nobody
          description: "Who acts next."
        form:
          allOf:
            - $ref: #/components/schemas/TollFreeVerificationInput
          description: "The form as it stands, every field. contact_email is always our support address: the carriers write to us, and we forward what only you can answer."
        business:
          type: object
          nullable: true
          description: "The business on the form, as business verification sees it."
          properties:
            status:
              type: string
              enum:
                - not_started
                - pending
                - verified
                - rejected
            attestation_needed:
              type: boolean
              description: "Submit needs an attestation for these business details."
            signed:
              type: object
              nullable: true
              properties:
                signer_name:
                  type: string
                signer_title:
                  type: string
                signed_at:
                  type: string
                  format: date-time
            rejection:
              type: object
              nullable: true
              properties:
                code:
                  type: string
                note:
                  type: string
                  nullable: true
        rejection:
          type: object
          nullable: true
          description: "Set while rejected: what the carriers or our team asked for."
          properties:
            reason:
              type: string
            rejected_at:
              type: string
              format: date-time
        carrier_reference:
          type: string
          nullable: true
          description: "The carriers' case number, once they give one."
        registration_id:
          type: string
          nullable: true
          description: "The registration it was filled in from, if any."
        history:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              status:
                type: string
                enum:
                  - draft
                  - in_review
                  - submitted
                  - verified
                  - rejected
              actor:
                type: string
                enum:
                  - customer
                  - staff
                  - system
                  - carrier
              note:
                type: string
                nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Finding:
