  "/verify":
    post:
      operationId: sendVerification
      summary: "Send a verification code"
      description: "Generates a one-time code and sends it by text (`channel: \"sms\"`, the default) or by email (`channel: \"email\"` with `email`). Enforces expiry, attempt limits and anti-pumping controls. You do NOT need to own a phone number; TextKit sends from its own verification pool. If the pool is unavailable, a live code is sent from one of your own numbers that can already text anyone (sender status `active`, or a verified toll-free number, whose codes always name its verified business); a number still being registered is never used, and with none ready the request is refused (400) and nothing is sent. Nothing is billed here; a verification is charged only when the code is checked successfully. Supports the Idempotency-Key header, so a retried request does not text a second code. By email: the same template, limits per address and per domain, disposable addresses refused (403 `verification_blocked`), and test keys never send (the code is 111111)."
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: "Makes retries safe for 24 hours: the same key and body replays the original successful response (with Idempotent-Replayed: true); a different body returns 409. Failed requests release the key."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                    - sms
                    - email
                  default: sms
                  description: "How the code goes out. `sms` needs `phone`; `email` needs `email`."
                phone:
                  type: string
                  example: +14155550132
                  description: "The number to text the code to (channel `sms`). `to` works too."
                email:
                  type: string
                  example: "ada@example.com"
                  description: "The address to email the code to (channel `email`). Disposable addresses are refused."
                app_name:
                  type: string
                  maxLength: 24
                  description: "Your product name, shown in the message"
                user_ip:
                  type: string
                  description: "Optional. Your end user's IP address, as your server saw it. With it, one person requesting codes for many numbers or addresses is limited (20 an hour per IP on your account, texts and emails together); without it there is no per-IP limit, since requests come from your server."
                from:
                  type: string
                  description: "Optional, channel `sms` only: send from a number you own instead of the TextKit pool"
                customer_id:
                  type: string
                  description: "Optional: attribute the verification to one of your customers"
      responses:
        201:
          description: "Verification created"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Verification
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        403:
          description: "Blocked by Shield, or recipient_opted_out (the number opted out, or texted STOP to the number the code comes from; they text START to get codes again). charged: false"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "Idempotency conflict"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        503:
          description: "channel_unavailable: email codes cannot go out right now. Send a text instead (charged: false)"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/verify/{id}/fallback":
    post:
      operationId: fallbackVerification
      summary: "Email the code instead"
      description: "The text did not arrive: email a code for the same verification. One verification id, so one charge when the code is checked. The email carries a new code that replaces the texted one; Check it by `email`: it proves the address, not the phone (a check by `phone` answers 409 `invalid_state`). The try count carries over and the new code gets a fresh 10 minutes. Once per verification, while it is pending (409 `invalid_state` otherwise). The email limits of POST /verify apply. Test keys send nothing; the code stays 111111. Supports the Idempotency-Key header."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: "Makes retries safe for 24 hours: the same key and body replays the original successful response (with Idempotent-Replayed: true); a different body returns 409. Failed requests release the key."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: "ada@example.com"
                  description: "The address to email the code to"
                channel:
                  type: string
                  enum:
                    - email
                  default: email
                  description: "The channel to fall back to. Only `email` today."
                user_ip:
                  type: string
                  description: "Optional. Your end user's IP address, counted in the same per-IP limit as POST /verify."
      responses:
        200:
          description: "The verification, now on channel `email`"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Verification
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        403:
          description: "Blocked by Shield (charged: false)"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "Not found"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "invalid_state: already moved to email, or no longer pending; or an idempotency conflict"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        503:
          description: "channel_unavailable: email codes cannot go out right now (charged: false)"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/verify/check":
    post:
      operationId: checkVerification
      summary: "Check a verification code"
      description: "The only billable moment in Verify. `charged` tells you whether this call was billed."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
