                $ref: #/components/schemas/Error
  "/webhooks/{id}/replay":
    post:
      operationId: replayFailedWebhooks
      summary: "Replay every failed delivery to an endpoint"
      description: "Queues each event whose deliveries to this endpoint all failed between `since` and `until` (default: the last 24 hours; at most 7 days and 50 events a call). Queued events go out within 5 minutes, with the normal retry schedule. `more: true` means call again. The endpoint must be active. To send one event now, use POST /v1/events/{id}/replay. Scope: webhooks:write."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: we_a1B2c3D4e5F6
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: object
              properties:
                since:
                  type: string
                  format: date-time
                  description: "ISO date or epoch milliseconds. Default: 24 hours before `until`."
                until:
                  type: string
                  format: date-time
                  description: "ISO date or epoch milliseconds. Default: now."
      responses:
        200:
          description: "What was queued"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - webhook_replay
                  endpoint_id:
                    type: string
                  since:
                    type: string
                    format: date-time
                  until:
                    type: string
                    format: date-time
                  queued:
                    type: integer
                  missing:
                    type: array
                    items:
                      type: string
                    description: "Event ids past the 30-day event retention."
                  more:
                    type: boolean
                  limit:
                    type: integer
                    example: 50
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        409:
          description: "The endpoint is paused"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
