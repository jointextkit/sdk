        last_message_id:
          type: string
          nullable: true
        counts:
          type: object
          properties:
            sent:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
        test:
          type: boolean
          description: "Made with a test key: only ever sends in the sandbox."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        recent_occurrences:
          type: array
          description: "Only on GET /schedules/{id}: the last 10 occurrences, newest first."
          items:
            type: object
            properties:
              date:
                type: string
