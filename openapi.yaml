                      - webhook_test
                  endpoint_id:
                    type: string
                  ok:
                    type: boolean
                  status_code:
                    type: integer
                    nullable: true
                  error:
                    type: string
                    nullable: true
                    enum:
                      - timeout
                      - unreachable
