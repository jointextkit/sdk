    patch:
      operationId: updateSpendLimit
      summary: "Set or remove the monthly spend limit and alert thresholds"
      description: "Live outbound messages that would exceed the cap are rejected with 403 spend_limit_reached and not charged. Thresholds fire spend.threshold_reached once each per month. Scope: billing."
