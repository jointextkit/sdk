  "/events/wait":
    get:
      operationId: waitForEvents
      summary: "Long-poll for new events"
      description: "Holds the request until an event newer than `cursor` exists or `timeout` seconds pass, then returns the new events oldest first and the cursor to send next. Call once without `cursor` to get one that means \"from now\" (answers immediately, empty). An event can be returned more than once: de-duplicate by `id`. Reads the event log only: no webhook endpoint is called and no delivery is recorded. This is what `textkit listen` runs on. Rate limit: 600 requests per 5 minutes, separate from other calls. Scope: webhooks."
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: "The `cursor` of the previous response. Omit on the first call."
        - name: timeout
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 25
            default: 20
          description: "Seconds to hold the request."
      responses:
        200:
          description: "New events, oldest first"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - event_wait
                  data:
                    type: array
                    items:
                      $ref: #/components/schemas/Event
                  cursor:
                    type: string
                    description: "Send as `cursor` on the next call."
                  has_more:
                    type: boolean
                    description: "More events are already waiting: call again without pausing."
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
