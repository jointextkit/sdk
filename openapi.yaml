                properties:
                  verified:
                    type: boolean
                  channel:
                    type: string
                    enum:
                      - sms
                      - email
                    description: "The channel of the code checked"
                  phone:
                    type: string
                    nullable: true
                    description: "Channel `sms`: the number the code proved"
                  email:
                    type: string
                    nullable: true
                    description: "Channel `email`: the address the code proved (after a fallback, the email, never the phone)"
                  status:
                    type: string
                    enum:
                      - approved
                      - pending
                      - expired
                      - max_attempts
                  attempts:
                    type: integer
                  charged:
                    type: boolean
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        404:
          description: "No active verification"
          content:
