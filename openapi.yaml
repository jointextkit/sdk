                            - skipped
                        message_id:
                          type: string
                          nullable: true
                        body:
                          type: string
                        segments:
                          type: integer
                          nullable: true
                        reason:
                          type: string
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
        400:
          description: "Invalid input"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        403:
          description: "`to` is not your phone or a verified recipient"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
