  "/test/inbound":
    post:
      operationId: simulateInbound
      summary: "Simulate an inbound SMS (test keys only)"
      description: "Runs through the real inbound pipeline and emits `message.received` with `simulated: true`. Once the account has live access, STOP, START, YES and HELP change consent only when `from` is a +1 500 555 number or one of your verified numbers; from any other number the message is handled as an ordinary one and the response carries a `notice`."
