          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Your API key, e.g. Authorization: Bearer tk_sk_test_.... Keys may be restricted to scopes (messages:send, messages:read, numbers:read, numbers:write, verify, consent, lookup, webhooks, webhooks:write, customers, contacts, registrations, billing, automations, audit_logs:read, links, keys); a restricted key outside its scopes gets 403 insufficient_scope. Keys without scopes have full access."
  schemas:
    Message:
      type: object
      properties:
        id:
          type: string
          example: msg_a1B2c3D4e5F6g7H8
        object:
          type: string
          enum:
            - message
        to:
          type: string
          example: +15005550006
        from:
          type: string
          example: +15005550100
        body:
          type: string
        direction:
          type: string
          enum:
            - outbound
            - inbound
        status:
          type: string
          enum:
            - queued
            - sent
            - delivered
            - failed
            - blocked
            - received
          description: "`blocked`: refused by one of our checks before any carrier saw it (opt-out, quiet hours, unregistered sender, content, allowance, spend limit, credits). Final, never charged; `failure` says why. `failed`: accepted, then not delivered."
        test:
          type: boolean
        simulated:
          type: boolean
          description: "True when nothing was handed to a carrier: every test-key message except one sent to your own verified phone. Always false on live messages. A simulated message still reaches `delivered`."
        notice:
          type: string
          description: "Only on the response to POST /messages. Present when a test-key send to a real-looking number was simulated: says nothing was sent and how to send for real."
        schedule_id:
          type: string
          description: "The recurring schedule this message is an occurrence of. Present only when set."
        tags:
          type: array
          items:
            type: string
          example:
            - spring-sale
          description: "The labels sent with the message (`tags` on POST /messages), lowercased. Present only when set."
        category:
          type: string
          enum:
            - marketing
            - transactional
            - otp
          description: "How the message was classified. Present when you sent one, or when it was classified as marketing."
        disclosures_added:
          type: array
          items:
            type: string
            enum:
              - brand
              - opt_out
          description: "Wording we added to a message from a number linked to a registration ([what we add](/docs/compliance-checks#what-we-add)): `brand`, your business name in front of a person's first message; `opt_out`, \" Reply STOP to opt out.\" on marketing that had none. `body` is the text as sent. Present only when we added something."
        deferred:
          type: object
          description: "Present when the message was held for quiet hours and sent when the window opened."
          properties:
            reason:
              type: string
              enum:
                - quiet_hours
            held_at:
              type: string
              format: date-time
        redacted_at:
          type: string
          format: date-time
          description: "When the message was redacted (POST /messages/{id}/redact): `body` is empty and `media` is gone. Present only then."
        links:
          type: array
          description: "Links shortened with `shorten_links`, in the order they appear. On the send response and GET /messages/{id} (with clicks so far); not on list pages. `body` is the text as sent, with the short links."
          items:
            type: object
            properties:
              url:
                type: string
                description: "The link as you wrote it."
              short_url:
                type: string
                example: "https://links.example.com/Ab3dEf9h"
              clicks:
                type: integer
                description: "Opens by people. Link previews (a messaging app fetching the link to draw a preview) are not counted."
              first_clicked_at:
                type: string
                format: date-time
                nullable: true
              last_clicked_at:
                type: string
                format: date-time
                nullable: true
        created_at:
          type: string
          format: date-time
        media:
          type: array
          items:
            type: string
            format: uri
          description: "MMS attachments (inbound today)."
        sent_by:
          type: string
          description: "Console user or API key that composed it."
        failure_reason:
          type: string
          description: "The carrier's raw text for a failed send. Kept for compatibility; see `failure`."
        attempts:
          type: integer
          description: "Live sends: carrier submissions so far. More than 1 means it was retried."
        next_attempt_at:
          type: string
          format: date-time
          description: "Present while queued for an automatic carrier retry."
        receipt_status:
          type: string
          enum:
            - missing
          description: "The carrier accepted the message but sent no delivery report within 72 hours. status stays sent."
        customer_id:
          type: string
          description: "The customer this is attributed to. Present only when set."
        timeline:
          type: array
          description: "Every status transition, oldest first. Inbound messages have a single `received`."
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  - accepted
                  - validated
                  - queued
                  - sent_to_carrier
                  - carrier_accepted
                  - retry_scheduled
                  - delivered
                  - failed
                  - blocked
                  - received
              at:
                type: string
                format: date-time
              attempt:
                type: integer
                description: "Carrier attempt this step belongs to (from sent_to_carrier on)."
        segments:
          type: integer
          description: "Parts the body is split into (GSM-7: 160, then 153 each; UCS-2: 70, then 67)."
          example: 1
        encoding:
          type: string
          enum:
            - gsm7
            - ucs2
        price:
          type: object
          nullable: true
          description: "What this message costs, in USD: the outbound rate per segment, plus the recipient's carrier fee per segment, at cost, as its own line. Null on messages sent before prices were recorded."
          properties:
            total:
              type: number
              example: 0.0082
            currency:
              type: string
              enum:
                - usd
            breakdown:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  amount:
                    type: number
        destination_carrier:
          type: string
          nullable: true
          description: "The recipient's mobile carrier, when a cached lookup knows it."
        failure:
          allOf:
            - $ref: #/components/schemas/Failure
          nullable: true
          description: "Null unless status is `failed`."
    Batch:
      type: object
      properties:
        id:
          type: string
          example: bc_a1B2c3D4e5F6
        object:
          type: string
          enum:
            - batch
        name:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - sending
            - paused
            - complete
            - canceled
        from:
          type: string
        body:
          type: string
        source:
          type: string
          enum:
            - api
            - csv
            - contacts
        test:
          type: boolean
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        shorten_links:
          type: boolean
          description: "Links become tracked short links when each message is sent."
        completed_at:
          type: string
          format: date-time
          nullable: true
        counts:
          type: object
          description: "total = queued + sent + failed + opted_out + canceled, always. \"sent\" = accepted by the carrier; what happened next (delivered, failed, replies) is GET /v1/batches/{id}/results. \"opted_out\" also counts recipients unsubscribed from the batch topic."
