  "/plan":
    get:
      operationId: planTask
      summary: "Questions to settle before a task"
      description: "For anything a person does here (send a text, buy or release a number, register for 10DLC, verify a toll-free number, request a short code, send verification codes, a recurring text, a segment, template, list, topic, connecting a tool, a webhook, an API key, a link domain, a spend limit, a number pool, importing opt-outs, an automation, a broadcast, bringing people in): the questions to ask, each with the request fields it fills and this account's options (its numbers, registrations, topics, segments, lists, templates, integrations, and the allowed values from this spec). `inputs` lists every field the task's operation takes, read from this spec, marked asked or not. `rules` says what the person should hear first, `gaps` what is missing, and `person_submits` when the person files it in the console (carrier registrations). Without `task`: the tasks. Automations and broadcasts answer with the campaign plan; bringing people in with the import plan. Reads the account and changes nothing. Scope: contacts."
      parameters:
        - name: task
          in: query
          schema:
            type: string
          description: "A task key (buy_number, register_10dlc, ...) or the person's own words (\"buy a number\"). Omit to list the tasks."
      responses:
        200:
          description: "The plan, or the task list"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - task_plan
                      - task_catalog
                      - campaign_plan
                      - import_plan
                  task:
                    type: string
                  how:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        ask:
                          type: string
                        sets:
                          type: array
                          items:
                            type: string
                        options:
                          type: array
                          items: {}
                        default: {}
                        when:
                          type: string
                  inputs:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        required:
                          type: boolean
                        asked:
                          type: boolean
                  rules:
                    type: array
                    items:
                      type: string
                  gaps:
                    type: array
                    items:
                      type: string
                  person_submits:
                    type: string
                  console_url:
                    type: string
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/campaigns/plan":
    get:
      operationId: planCampaign
      summary: "Questions to settle before a send"
      description: "Every input an automation or a broadcast needs, as questions to ask the person, each with this account's options: for an automation, the starting event (tracked events with their properties and the Mixpanel events mapped to them), filters, the delay before the first text, the event that ends it, follow-ups, repeats (cooldown), who gets it, the message and link, the sender and the topic; for a broadcast, the audience, who to leave out, the message, when, the sender, the topic and a follow-up. `exclusions` lists who never gets the text (opt-outs, topic unsubscribes, no opt-in for marketing, quiet hours, runs in progress, cooldown). `gaps` says what is missing (no number, no events yet, mapped events that never arrived). Reads the account and changes nothing. Scope: contacts."
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - automation
              - broadcast
            default: automation
          description: "automation (texts started by an event) or broadcast (one send to an audience)."
      responses:
        200:
          description: "The plan"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - campaign_plan
                  kind:
                    type: string
                  how:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        ask:
                          type: string
                        sets:
                          type: string
                        options:
                          type: array
                          items: {}
                        default: {}
                        when:
                          type: string
                  exclusions:
                    type: array
                    items:
                      type: string
                  gaps:
                    type: array
                    items:
                      type: string
                  context:
                    type: object
                  console_url:
                    type: string
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/contacts/import/sources":
    get:
      operationId: importSources
      summary: "Ways to bring an audience in"
      description: "Where an audience can come from and every way to bring it here. Without `source`: the questions to ask (where the people are, which group, what you can sign in to, whether consent was recorded, once or synced) and the kinds of source we know. With `source` (free text, e.g. \"Mixpanel\" or \"our Postgres users table\"): the ways in, best first: an integration already syncing it, tools you already have for it, our 6-hourly sync, connected with your key here or in the console, a push to an ingest URL, a script against its API with a key from your environment, its export screen, and the console upload. Also lists the integrations already connected. Reads nothing else and changes nothing."
      parameters:
        - name: source
          in: query
          schema:
            type: string
          description: "Where the people are, in your words. Omit to get the questions first."
      responses:
        200:
          description: "The import plan"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - import_plan
                  source:
                    type: object
                    nullable: true
                    properties:
                      key:
                        type: string
                      label:
                        type: string
                      kind:
                        type: string
                      synced:
                        type: boolean
                        description: "We have our own sync for it"
                      consent:
                        type: string
                        nullable: true
                        description: "Where it records SMS consent"
                  questions:
                    type: array
                    items:
                      type: string
                  connected:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        provider:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        list_id:
                          type: string
                  paths:
                    type: array
                    items:
                      type: object
                      properties:
                        method:
                          type: string
                          enum:
                            - connected
                            - your_tools
                            - integration
                            - push
                            - api
                            - export
                            - upload
                        title:
                          type: string
                        when:
                          type: string
                        steps:
                          type: array
                          items:
                            type: string
                        console_url:
                          type: string
                          description: "The console page for this way in"
                  consent:
                    type: string
                    description: "How consent carries over"
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/contacts/import":
    post:
      operationId: importContacts
      summary: "Bulk create or update contacts"
      description: "Up to 500 per request, keyed on phone number, with the same merge rule as POST /contacts. Rows that cannot be imported come back in skipped; the rest still land. `dry_run: true` returns the summary (found, valid, malformed, duplicates, landlines, already opted out, will create / update, eligible) and writes nothing. A row with `opt_in.status: true` (or a date or source) stores opt-in evidence in the consent ledger; `opt_in.status: false` records the number as opted out. An import never opts anyone back in."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - contacts
              properties:
                contacts:
                  type: array
                  maxItems: 500
                  items:
                    $ref: #/components/schemas/ContactInput
                  description: "Contacts to create or update, up to 500 per call"
                campaign_id:
                  type: string
                  example: reg_a1B2c3D4e5F6
                  description: "Applies to every opt_in row that does not name its own campaign_id"
                dry_run:
                  type: boolean
                  description: "true returns what would change and writes nothing"
                check_line_types:
                  type: boolean
                  description: "dry_run only. Looks up line types to count landlines; live lookups are paid, so only the first 500 numbers are checked."
                import_id:
                  type: string
                  description: "From a previous response, to group several requests as one import."
                name:
                  type: string
                  description: "A label for the import (first request only)."
      responses:
        200:
          description: "Import result, or the dry-run preview"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - contact_import
                      - contact_import_preview
                  created:
                    type: integer
                  updated:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: "Position of the row in the request"
                        value:
                          type: string
                        reason:
                          type: string
                  import_id:
                    type: string
                    example: imp_a1B2c3D4e5
                  opted_out:
                    type: integer
                    description: "Rows recorded as opted out because they were marked unsubscribed."
                  summary:
                    type: object
                    description: "dry_run only."
                    properties:
                      found:
                        type: integer
                      valid:
                        type: integer
                      malformed:
                        type: integer
                      duplicates:
                        type: integer
                      landlines:
                        type: integer
                        nullable: true
                        description: "null unless check_line_types was set"
                      already_opted_out:
                        type: integer
                      marked_unsubscribed:
                        type: integer
                      will_create:
                        type: integer
                      will_update:
                        type: integer
                      eligible:
                        type: integer
                        description: "Would receive a broadcast today"
                  rejected:
                    type: array
                    description: "dry_run only."
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        phone_number:
                          type: string
                        reason:
                          type: string
                          enum:
                            - malformed
                            - duplicate
                            - landline
                        detail:
                          type: string
        400:
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/contacts/bulk":
