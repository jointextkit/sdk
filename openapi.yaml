              type: string
              format: uri
            privacy_url:
              type: string
              format: uri
            terms_url:
              type: string
              format: uri
            support_email:
              type: string
              format: email
            sample_messages:
              type: array
              items:
                type: string
              description: "Starter drafts written for this business (drafting only). Send them as starter_messages."
            brand:
              type: object
              description: "Never includes ein or entity_type."
              properties:
                legal_name:
                  type: string
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postal_code:
                  type: string
                country:
                  type: string
                vertical:
                  type: string
                  enum:
                    - PROFESSIONAL
                    - REAL_ESTATE
                    - HEALTHCARE
                    - HUMAN_RESOURCES
                    - ENERGY
                    - ENTERTAINMENT
                    - RETAIL
                    - TRANSPORTATION
                    - AGRICULTURE
                    - INSURANCE
                    - POSTAL
                    - EDUCATION
                    - HOSPITALITY
                    - FINANCIAL
                    - LEGAL
                    - CONSTRUCTION
                    - NGO
                    - MANUFACTURING
                    - GOVERNMENT
                    - TECHNOLOGY
