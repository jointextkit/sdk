              type: integer
            max:
              type: integer
            encoding:
              type: string
              enum:
                - GSM-7
                - UCS-2
        estimated_cost_usd:
          type: number
        preview:
          type: array
          items:
            type: object
            properties:
              to:
                type: string
              body:
                type: string
              segments:
                type: integer
        rejected:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                description: "0-based index into recipients"
              to:
                type: string
              reason:
                type: string
                enum:
                  - invalid
                  - duplicate
                  - opted_out
                  - topic_unsubscribed
                  - missing_variable
                  - landline
                  - empty_after_merge
              detail:
                type: string
        consent:
          type: object
          description: "Dry run only. What the consent gate would decide at send time for the first 1,000 accepted recipients: `no_opt_in` would be refused `consent_required` (marketing without an opt-in on file, or a recurring message from a registered number). Informational; every message is still checked when it sends."
          properties:
            checked:
              type: integer
            unchecked:
              type: integer
              description: "Accepted recipients past the first 1,000, not checked"
            no_opt_in:
              type: integer
            no_opt_in_sample:
              type: array
              items:
                type: string
              description: "Up to 20 of them"
            unknown:
              type: integer
              description: "Consent could not be read; the send retries these"
    ApiKey:
      type: object
