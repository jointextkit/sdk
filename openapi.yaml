        detail:
          type: string
          nullable: true
        retryable:
          type: boolean
        attempts:
          type: integer
        message_id:
          type: string
          nullable: true
        variables:
          type: object
          additionalProperties:
            type: string
    BatchValidation:
      type: object
      properties:
        object:
          type: string
          enum:
            - batch_validation
        counts:
          type: object
          properties:
            rows:
              type: integer
            valid:
              type: integer
            invalid:
              type: integer
            duplicates:
              type: integer
            opted_out:
              type: integer
            topic_unsubscribed:
              type: integer
              description: "Unsubscribed from the batch topic_id; 0 without a topic"
            missing_variable:
              type: integer
            landline:
              type: integer
            empty_after_merge:
              type: integer
        unknown_variables:
          type: array
          items:
            type: string
        segments:
          type: object
          properties:
