  "/batches/{id}/results":
    get:
      operationId: getBatchResults
      summary: "Results of a batch"
      description: "What happened after the queue: `attempted = delivered + failed + pending`. `delivered` and `failed` come from carrier delivery receipts; `pending` was accepted by the carrier with no final receipt (`no_receipt` of those never got one). `replies` are inbound messages from recipients to the sending number within `reply_window_hours` of the batch finishing (opt-out keywords are not counted); `stops` are recipients who opted out in that time and are still opted out. `spent_usd` sums the recorded price of each message. `failures` groups failed recipients by reason. Derived from stored messages and cached for up to a minute while numbers can still move; `partial: true` means a read bound was hit and delivered / replies are floors."
