  "/copy/recommend":
    get:
      operationId: recommendMessage
      summary: "Recommend which text to send"
      description: "Candidate SMS copy for a goal, ranked by expected revenue per message, each with the evidence behind its score: the factors that moved it and how many case studies each rests on, the closest published SMS-only case studies with their source links, and how much of the score comes from your own sends. The prior is a dataset of documented SMS campaigns by industry, company type and message type (results that mix SMS with email or push are listed but never counted); your batches and automations (clicks, STOPs, and revenue from tracked events with a `revenue` property within 7 days) update it. Candidates are built only from your inputs, so none invents an offer, code or date. Sends and saves nothing."
      parameters:
        - name: industry
          in: query
          required: true
          schema:
            type: string
            enum:
              - apparel
              - home_goods
              - food_beverage
              - restaurant
              - beauty
              - health_wellness
              - cannabis
              - hospitality
              - consumer_app
              - fintech
              - fitness
              - pets
              - arts_crafts
              - jewelry_accessories
              - sporting_goods
              - electronics
              - services
              - other
          description: "The sender's industry"
        - name: company_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - ecommerce
              - subscription_ecommerce
              - subscription_app
              - consumer_app
              - restaurant
              - hospitality
              - retail
              - marketplace
              - fintech
              - services
          description: "Kind of business"
        - name: goal
          in: query
          schema:
            type: string
            enum:
              - any
              - abandoned_cart
              - abandoned_browse
              - welcome
              - winback
              - failed_payment
              - trial
              - promo
              - re_engagement
              - post_purchase
              - back_in_stock
              - quiz
              - launch
              - transactional
              - mixed
            default: any
          description: "The message type to write, or `any` to compare the types that fit `audience`"
        - name: audience
          in: query
          schema:
            type: string
          description: "Who gets it, in words, e.g. \"opened the paywall and left\""
        - name: brand
          in: query
          required: true
          schema:
            type: string
            maxLength: 40
          description: "Business name as customers know it"
        - name: product
          in: query
          required: true
          schema:
            type: string
            maxLength: 60
          description: "What is being sold, as the customer would say it, e.g. \"your second number\""
        - name: offer
          in: query
          schema:
            type: string
          description: "Optional, e.g. \"50% off your first month\". Without one no candidate has an offer"
        - name: code
          in: query
          schema:
            type: string
          description: "Optional promo code"
        - name: deadline
          in: query
          schema:
            type: string
          description: "Optional, e.g. \"tonight\""
        - name: link
          in: query
          schema:
            type: string
          description: "URL or merge field; default {{link}}"
        - name: first_name
          in: query
          schema:
            type: boolean
          description: "Your contacts have first names, so candidates may use {{first_name}}"
        - name: first_message
          in: query
          schema:
            type: boolean
          description: "The first text these people get from the number: the brand and opt-out line are added and counted"
        - name: candidates
          in: query
          schema:
            type: string
          description: "Your own drafts to score: a JSON array of up to 10 strings"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          description: "How many messages to return (default 5, max 20)"
        - name: use_history
          in: query
          schema:
            type: boolean
            default: true
          description: "false ranks on the case studies only"
      responses:
        200:
          description: "Ranked copy with evidence"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - copy_recommendation
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        text:
                          type: string
                        message_type:
                          type: string
                        origin:
                          type: string
                          enum:
                            - composed
                            - writer
                            - yours
                        score:
                          type: number
                        expected_revenue_per_message_usd:
                          type: object
                          nullable: true
                          properties:
                            p10:
                              type: number
                            p50:
                              type: number
                            p90:
                              type: number
                        expected_ctr:
                          type: number
                          nullable: true
                        segments:
                          type: integer
                        features:
                          type: array
                          items:
                            type: string
                        drivers:
                          type: array
                          items:
                            type: object
                            properties:
                              factor:
                                type: string
                              effect:
                                type: number
                              rows:
                                type: integer
                        history_weight:
                          type: number
                        notes:
                          type: array
