  "/segments/preview":
    post:
      operationId: queryAudience
      summary: "Query an audience without saving it"
      description: "Runs a rule list now and answers with the counts `GET /segments/{id}/preview` gives plus the first `limit` matching contacts. Use it to ask cohort questions (who replied in the last 7 days, who got a batch and did not reply, who did one event and not another) before saving the rules as a segment to page through or send to. `eligible + opted_out + topic_unsubscribed = matched`."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                match:
                  type: string
                  enum:
                    - all
                    - any
                  default: all
                  description: "all: a contact must match every rule. any: at least one rule"
                rules:
                  type: array
                  maxItems: 10
                  items:
                    $ref: #/components/schemas/SegmentRule
                  example:
                    - field: last_reply_at
                      op: after
                      value: 7d
                    - field: tag
                      op: is
                      value: vip
                  description: "Up to 10 rules that decide who matches"
                topic_id:
                  type: string
                  description: "Topic id or name: eligible also removes contacts unsubscribed from it"
                limit:
