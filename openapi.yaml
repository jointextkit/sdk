              - page
              - ai
          description: "Where each suggested field came from: page = read from your pages by fixed rules; ai = drafted for you"
        candidates:
          type: object
          description: "Pages that could be the opt-in, privacy policy and terms, best first"
          properties:
            opt_in:
              type: array
