          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    patch:
      operationId: updateWebhookEndpoint
      summary: "Update a webhook endpoint"
      description: "Change the URL, the subscribed events, or pause and resume delivery with `active`. Send only the fields to change. The signing secret is unchanged (POST /v1/webhooks/{id}/rotate_secret replaces it). Recorded in the audit log as webhook.updated. Scope: webhooks:write."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: "The https URL that receives the events"
                events:
                  oneOf:
                    - type: string
                      enum:
                        - "*"
                    - type: array
                      items:
                        type: string
                  description: "Event types to send, or * for all"
                active:
                  type: boolean
                  description: "false pauses delivery; pending retries for a paused endpoint are dropped."
                description:
                  type: string
                  maxLength: 120
                  nullable: true
                  description: "A note on what the endpoint is for"
                numbers:
                  type: array
                  maxItems: 100
                  nullable: true
                  items:
                    type: string
                  description: "Replace the number filter; [] or null clears it."
      responses:
        200:
          description: "The updated endpoint"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/WebhookEndpoint
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
    delete:
      operationId: deleteWebhookEndpoint
      summary: "Delete a webhook endpoint"
      description: "Removes the endpoint and stops delivery to it. Recorded in the audit log as webhook.deleted. Scope: webhooks:write."
      responses:
        200:
          description: Deleted
          content:
            "application/json":
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    enum:
                      - webhook_endpoint
                  deleted:
                    type: boolean
                    enum:
                      - true
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/webhooks/callback_secret":
    post:
      operationId: rotateCallbackSecret
      summary: "Create or rotate the status callback secret"
      description: "The signing secret for `status_callback` requests (POST /v1/messages), returned once. The first call creates it (201); a later call replaces it (200) and the old secret keeps signing for 24 hours, as a second `v1=` in the signature header. Callbacks are signed exactly like webhook endpoints (`textkit-signature`). Recorded in the audit log as webhook.secret_rotated. Scope: webhooks:write."
      responses:
        200:
          description: Rotated
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/CallbackSecret
        201:
          description: Created
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/CallbackSecret
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
  "/webhooks/{id}/rotate_secret":
    post:
      operationId: rotateWebhookSecret
      summary: "Rotate a webhook signing secret"
      description: "Replaces the signing secret and returns the new one: the only time the API shows it. With `expire_previous_in`, the old secret keeps signing for that many seconds (up to 7 days) as a second `v1=` in the signature header, so you can deploy the new secret without dropping events; every TextKit SDK accepts either. 0 (the default) retires it now. Recorded in the audit log as webhook.secret_rotated. Scope: webhooks:write."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: we_a1B2c3D4e5F6
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: object
              properties:
                expire_previous_in:
                  type: integer
                  minimum: 0
                  maximum: 604800
                  default: 0
                  description: "Seconds the old secret keeps signing alongside the new one."
                  example: 86400
      responses:
        200:
          description: "The endpoint with its new secret (shown once)"
          content:
            "application/json":
              schema:
                allOf:
                  - $ref: #/components/schemas/WebhookEndpoint
                  - type: object
                    properties:
                      secret:
                        type: string
                        example: whsec_a1B2c3D4e5F6g7H8a1B2c3D4e5F6g7H8
                      previous_secret_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: "When the old secret stops signing; null when it already has."
        401:
          description: "Missing, malformed, or revoked API key"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        402:
          description: "Billable live calls only: the prepaid credit balance cannot cover the call (insufficient_credits); nothing was done or charged"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
        429:
          description: "Rate limit or quota exceeded"
          content:
            "application/json":
              schema:
                $ref: #/components/schemas/Error
